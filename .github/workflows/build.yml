name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor kur
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap init "IOZ Penalty Legend" com.ioz.penaltylegend --web-dir=www
          npx cap add android
      - name: Ikon ve dikey ekran
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          convert icon.png -resize 676x676 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png || true
          convert -size 1024x1024 xc:black assets/icon-background.png || true
          npx capacitor-assets generate --android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IOZ-Penalty-Legend-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
