name: Build APK ve AAB
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor kur
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 sharp
          npx cap init "IOZ Penalty Legend" com.ioz.penaltylegend --web-dir=www
          npx cap add android
      - name: Ikon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          node -e "const s=require('sharp');const d={mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};(async()=>{for(const k in d){for(const n of ['ic_launcher','ic_launcher_round','ic_launcher_foreground']){await s('icon.png').resize(d[k],d[k]).toFile('android/app/src/main/res/mipmap-'+k+'/'+n+'.png')}}})()"
      - name: Tam ekran ve dikey
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/ioz/penaltylegend/MainActivity.java <<'JAVA'
          package com.ioz.penaltylegend;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              registerPlugin(UnityAdsPlugin.class);
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              hide();
            }
            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hide();
            }
            private void hide() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }
          }
          JAVA
          npx cap sync android
      - name: Unity Ads (odullu reklam)
        run: |
          cat > android/app/src/main/java/com/ioz/penaltylegend/UnityAdsPlugin.java <<'ADS'
          package com.ioz.penaltylegend;
          import android.app.Activity;
          import android.os.Handler;
          import android.os.Looper;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;

          @CapacitorPlugin(name = "UnityAds")
          public class UnityAdsPlugin extends Plugin {
            private static final String GAME_ID = "800362657";
            private static final String PLACEMENT = "Rewarded_Android";
            private static final boolean TEST_MODE = false;
            private boolean inited = false;
            private boolean initing = false;
            private boolean busy = false;
            private final Handler main = new Handler(Looper.getMainLooper());

            @Override
            public void load() {
              initSdk();
            }

            private void initSdk() {
              if (inited || initing) return;
              initing = true;
              UnityAds.initialize(getContext().getApplicationContext(), GAME_ID, TEST_MODE, new IUnityAdsInitializationListener() {
                @Override
                public void onInitializationComplete() {
                  inited = true;
                  initing = false;
                }
                @Override
                public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {
                  initing = false;
                }
              });
            }

            private void finish(PluginCall call, String status) {
              busy = false;
              JSObject r = new JSObject();
              r.put("status", status);
              call.resolve(r);
            }

            @PluginMethod
            public void show(final PluginCall call) {
              final Activity act = getActivity();
              if (act == null) {
                finish(call, "failed");
                return;
              }
              if (busy) {
                JSObject r = new JSObject();
                r.put("status", "busy");
                call.resolve(r);
                return;
              }
              if (!inited) {
                initSdk();
                JSObject r = new JSObject();
                r.put("status", "notready");
                call.resolve(r);
                return;
              }
              busy = true;
              final boolean[] done = {false};
              final Runnable timeout = new Runnable() {
                @Override
                public void run() {
                  if (!done[0]) {
                    done[0] = true;
                    finish(call, "noad");
                  }
                }
              };
              main.postDelayed(timeout, 20000);
              UnityAds.load(PLACEMENT, new IUnityAdsLoadListener() {
                @Override
                public void onUnityAdsAdLoaded(String placementId) {
                  if (done[0]) return;
                  main.removeCallbacks(timeout);
                  act.runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                      UnityAds.show(act, PLACEMENT, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                        @Override
                        public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                          if (done[0]) return;
                          done[0] = true;
                          finish(call, "failed");
                        }
                        @Override
                        public void onUnityAdsShowStart(String placementId) {}
                        @Override
                        public void onUnityAdsShowClick(String placementId) {}
                        @Override
                        public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                          if (done[0]) return;
                          done[0] = true;
                          finish(call, state == UnityAds.UnityAdsShowCompletionState.COMPLETED ? "completed" : "skipped");
                        }
                      });
                    }
                  });
                }
                @Override
                public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                  if (done[0]) return;
                  done[0] = true;
                  main.removeCallbacks(timeout);
                  finish(call, "noad");
                }
              });
            }
          }
          ADS
          cat >> android/app/build.gradle <<'GRADLE'
          dependencies {
            implementation 'com.unity3d.ads:unity-ads:4.16.6'
          }
          GRADLE
      - name: Surum ayarla (version.txt)
        run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle
          sed -i -E 's/(compileSdkVersion = )[0-9]+/\136/; s/(targetSdkVersion = )[0-9]+/\136/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          cat android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle
          VERSION=$(tr -d ' \r\n' < version.txt)
          echo "Surum: $VERSION  Kod: ${{ github.run_number }}"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Imza ayarla (anahtar varsa)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > android/app/release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              release {
                storeFile file("release.jks")
                storePassword System.getenv("KS_PASS")
                keyAlias System.getenv("KS_ALIAS")
                keyPassword System.getenv("KS_KEYPASS")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE
      - name: Release APK derle (oyunculara bu verilir)
        if: env.KS_B64 != ''
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Release AAB derle (Play Store)
        if: env.KS_B64 != ''
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Debug APK derle (sadece anahtar yoksa, test icin)
        if: env.KS_B64 == ''
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        if: env.KS_B64 != ''
        with:
          name: IOZ-Penalty-Legend-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: env.KS_B64 != ''
        with:
          name: IOZ-Penalty-Legend-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: env.KS_B64 == ''
        with:
          name: IOZ-Penalty-Legend-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
